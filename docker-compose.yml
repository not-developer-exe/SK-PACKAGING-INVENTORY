services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    env_file:
      - ./Server/.env
    environment:
      NODE_ENV: production
      PORT: 5001
    restart: unless-stopped
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
