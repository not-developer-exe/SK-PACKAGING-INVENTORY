name: CI

on:
  push:
    branches:
      - main
      - fix/production-readiness-foundation
      - feat/operating-expenses-and-admin-controls
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  client-build:
    name: Client install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build

  server-syntax:
    name: Server install, syntax, domain and replica-set integration tests
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017/sk-packaging-test?replicaSet=rs0
      JWT_SECRET: ci-integration-secret-that-is-long-enough
      NODE_ENV: test
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name sk-packaging-mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec sk-packaging-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec sk-packaging-mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          for attempt in $(seq 1 30); do
            if docker exec sk-packaging-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - name: Check JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run domain tests
        run: npm test
      - name: Run MongoDB-backed integration tests
        run: npm run test:integration

  container-build:
    name: Build production containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sk-packaging-api:ci ./Server
      - name: Build frontend image
        run: docker build -t sk-packaging-client:ci ./Client

  compose-box-costing:
    name: Validate same-origin calculator deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out ERP repository
        uses: actions/checkout@v4
      - name: Check out separate calculator repository
        uses: actions/checkout@v4
        with:
          repository: not-developer-exe/BOX-RATE-CALCULATOR
          ref: 0ffa359415b9e407e0a79cbbd371b65d002de208
          path: BOX-RATE-CALCULATOR
      - name: Create empty CI-only server env file
        run: touch Server/.env
      - name: Validate Docker Compose configuration
        run: BOX_COSTING_CONTEXT=BOX-RATE-CALCULATOR docker compose config --quiet
      - name: Build separate calculator and ERP frontend containers
        run: BOX_COSTING_CONTEXT=BOX-RATE-CALCULATOR docker compose build box-costing client
      - name: Validate ERP Nginx routes and owner auth gate
        run: docker run --rm --add-host server:127.0.0.1 --add-host box-costing:127.0.0.1 -v "$PWD/Client/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
