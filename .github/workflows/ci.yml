name: CI

on:
  push:
    branches:
      - main
      - fix/production-readiness-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  client-build:
    name: Client install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build client
        run: npm run build

  server-syntax:
    name: Server dependency install and syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run domain tests
        run: npm test
